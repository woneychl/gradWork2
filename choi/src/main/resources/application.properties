spring.application.name=choi
# DB 연결 설정 (PostgreSQL 기본 포트는 5432입니다)
# your_db 부분에 실제 생성하신 데이터베이스 이름을 적어주세요.
spring.datasource.url=jdbc:postgresql://bankdb.c12yak4o0wk1.ap-northeast-2.rds.amazonaws.com:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=kdu21240

# PostgreSQL 방언 설정 (Hibernate가 PostgreSQL 전용 쿼리를 생성하도록 함)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 자동 커밋/플러시 설정 (기존 autocommit=False와 유사한 관리)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
